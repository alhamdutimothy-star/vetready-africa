name: foundation-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: vetready_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test_runner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_runner:synthetic_ci_only@127.0.0.1:5432/vetready_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --cache /tmp/vetready-npm
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
